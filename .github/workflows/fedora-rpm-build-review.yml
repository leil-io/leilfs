name: Fedora RPM build and review

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
      options: --privileged

    steps:
      - name: Install git
        run: dnf install -y git

      - name: Trust the GitHub Actions workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install build dependencies
        run: dnf install -y fedora-packager python3-specfile

      - name: Run build script
        run: |
          cd rpm
          ./build.sh

      - name: Run review script
        run: |
          cd rpm
          ./review.sh

      - name: Upload Review Results
        uses: actions/upload-artifact@v4
        with:
          name: Fedora Review Report
          path: rpm/review-leilfs/review.txt
